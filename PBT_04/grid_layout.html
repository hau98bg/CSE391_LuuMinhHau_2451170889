<!DOCTYPE html>
<html>

<head>
    <title>Grid Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>ShopTLU</h1>
        </header>

        <section class="hero">
            <div class="hero-card">
                <h2>Sản phẩm nổi bật</h2>
                <p>Giảm giá 30%</p>
            </div>

            <div class="hero-item">
                Banner 1
            </div>

            <div class="hero-item">
                Banner 2
            </div>
        </section>

        <aside class="sidebar">
            <h3>Bộ lọc</h3>

            <label><input type="checkbox"> Laptop</label><br>
            <label><input type="checkbox"> Điện thoại</label><br>
            <label><input type="checkbox"> Phụ kiện</label><br>
            <label><input type="checkbox"> Khuyến mãi</label>
        </aside>

        <main class="main">

            <div class="card">
                <h3>Product 1</h3>
                <p>10.000.000đ</p>
            </div>

            <div class="card">
                <h3>Product 2</h3>
                <p>12.000.000đ</p>
            </div>

            <div class="card">
                <h3>Product 3</h3>
                <p>15.000.000đ</p>
            </div>

            <div class="card">
                <h3>Product 4</h3>
                <p>18.000.000đ</p>
            </div>

            <div class="card">
                <h3>Product 5</h3>
                <p>20.000.000đ</p>
            </div>

            <div class="card">
                <h3>Product 6</h3>
                <p>25.000.000đ</p>
            </div>

        </main>

        <aside class="ads">
            <img src="https://via.placeholder.com/200x400" alt="">
        </aside>

        <footer class="footer">
            <p>Copyright 2026</p>
        </footer>

    </div>

</body>

</html>
