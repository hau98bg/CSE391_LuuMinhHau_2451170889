<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Form đăng ký tài khoản E-Commerce.</title>
</head>
<body>
    <form action="#" method="post">
        <fieldset>
            <legend>Thông tin cá nhân</legend>
            <label for="fullname">Họ và tên:</label>
            <input type="text" id="fullname" name="fullname" placeholder =" Nhập họ và tên" required minlength="2" maxlength="50">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder =" Nhập email" required>

            <label for="phone">Số điện thoại:</label>
            <input type ="tel" id="phone" name ="phone" placeholder =" Nhập số điện thoại" pattern ="[0-9]{10}" required>

            <label for ="date" >Ngày sinh:</label>
            <input type ="date" id="date" name ="date" placeholder =" Chọn ngày sinh" max ="2026-01-05" required>
        </fieldset>

        <fieldset>
            <legend>Tài khoản:</legend>
            <label for="Username">Tên đăng nhập:</label>
            <input 
                type = "text"
                id ="Username" 
                name ="Username"
                placeholder =" Nhập tên đăng nhập"
                required
                pattern = "^[a-zA-Z0-9_]{5,20}$"
            >
            <label for = "Password"> Mật khẩu:</label>
            <input
                type = "password"
                id ="password"
                name = "password"
                placeholder =" Nhập mật khẩu"
                required
                minleght = "8"
                pattern = "^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$"
            >
            <label for ="confirm">Xác nhận mật khẩu:</label>
            <input
                type = "password"
                id = "confirm"
                name = "confirm"
                placeholder =" Xác nhận mật khẩu"
                required
                minleght ="8"
                pattern = "^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$"
            >    
        </fieldset>

        <fieldset>
            <legend>Thông tin giao hàng:</legend>
            <label for = "city">Thành phố</label>
            <select id = "city" 
                name = "city"
                required
            >
                <option value="">Chọn thành phố:</option>
                <option value="Hà Nội">Hà Nội</option>
                <option value="TP. Hồ Chí Minh">TP. Hồ Chí Minh</option>
                <option value="Đà Nẵng">Đà Nẵng</option>
                <option value="Bắc Giang">Bắc Giang</option>
            </select>

            <label for = "district">Quận/Huyện:</label>
            <select id = "district" 
                name = "district" 
                required
            >
                <option value="">Chọn quận/huyện:</option>
                <option value = "Quận 1">Quận 1</option>
                <option value = "Quận 2">Quận 2</option>
                <option value = "Quận 3">Quận 3</option>
            </select>

            <label for = "address">Địa chỉ cụ thể:</label>
            <textarea id = "address" 
                name = "address" 
                required
                rows = "3" 
                placeholder ="Nhập địa chỉ cụ thể..."
            >
            </textarea>
            <label for = "Nam">Nam</label>
            <input type = "radio" id = "Nam" name = "Nam" value = "Nam" required>
            <label for = "Nữ">Nữ</label>
            <input type = "radio" id = "Nữ" name = "Nữ" value = "Nữ" required> 
            <label for = "Khác">Khác</label>
            <input type = "radio" id = "Khác" name = "Khác" value = "Khác" required  
        >
        </fieldset>

       
        <label for="terms">
        <input type="checkbox" id="terms" name="terms" required>
        Tôi đồng ý với điều khoản
        </label>
      ]
      
        <button type="submit">Đăng ký</button>
        <button type="reset">Nhập lại</button>
    </form>
</body>
</html>
