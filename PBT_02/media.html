<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang giới thiệu</title>
</head>

<body>

    <h1>Trang giới thiệu mẫu điện thoại thông minh</h1>

    <!-- SVG inline -->
    <h2>Logo cửa hàng</h2>

    <svg width="120" height="120">
        <circle 
            cx="60" 
            cy="60" 
            r="50" 
            fill="skyblue" 
            stroke="blue" 
            stroke-width="4">
        </circle>

        <text 
            x="28" 
            y="68" 
            font-size="20" 
            fill="white">
            PHONE
        </text>
    </svg>

    <!-- Ảnh sản phẩm -->
    <h2>Các mẫu điện thoại nổi bật</h2>

    <figure>
        <img 
            src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9"
            alt="Điện thoại thông minh màu đen"
            loading="lazy"
            width="400"
            style="max-width: 100%; height: auto;">

        <figcaption>
            Điện thoại màn hình tràn viền hiện đại
        </figcaption>
    </figure>

    <figure>
        <img 
            src="https://images.unsplash.com/photo-1598327105666-5b89351aff97"
            alt="Điện thoại thông minh màu xanh"
            loading="lazy"
            width="400"
            style="max-width: 100%; height: auto;">

        <figcaption>
            Điện thoại camera chất lượng cao
        </figcaption>
    </figure>

    <figure>
        <img 
            src="https://images.unsplash.com/photo-1580910051074-3eb694886505"
            alt="Điện thoại thông minh hiện đại"
            loading="lazy"
            width="400"
            style="max-width: 100%; height: auto;">

        <figcaption>
            Điện thoại hiệu năng mạnh cho giải trí
        </figcaption>
    </figure>

    <!-- Video YouTube -->
    <h2>Video giới thiệu điện thoại</h2>

    <iframe 
        width="560" 
        height="315"
        src="https://youtu.be/_-AS5DtDeqs?si=1ghvGes6ffaXiIww"
        title="Video giới thiệu điện thoại"
        allowfullscreen>
    </iframe>

    <!-- Video HTML5 -->
    <h2>Video demo sản phẩm</h2>

    <video 
        controls
        poster="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9"
        width="600"
        style="max-width: 100%; height: auto;">

        <source src="video/dienthoai.mp4" type="video/mp4">
        <source src="video/dienthoai.webm" type="video/webm">

        .
    </video>

    <!-- Audio -->
    <h2>Nhạc nền giới thiệu</h2>

    <audio controls>
        <source src="audio/intro.mp3" type="audio/mpeg">

        
    </audio>

</body>
</html>
